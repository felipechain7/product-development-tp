<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del buffet · SIC</title>
<style>
  :root {
    --bg: #f3f4f1; --card: #ffffff; --ink: #1b1d1a; --muted: #62665e; --line: #dcdfd7;
    --nuevo: #b45309; --nuevo-bg: #fff3dc; --listo: #0f5c3a; --listo-bg: #e1f2e8; --btn-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131512; --card: #1d201c; --ink: #eef0ea; --muted: #a3a89c; --line: #30342d;
            --nuevo: #f59e0b; --nuevo-bg: #3a2c12; --listo: #3fae7a; --listo-bg: #16301f; --btn-ink: #0d1a13; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; flex: 1; min-width: 160px; }
  .contador { font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .conexion { font-size: .85rem; color: var(--muted); }
  .conexion.mal { color: var(--nuevo); font-weight: 700; }
  main { padding: 12px 16px 40px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; align-items: start; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; margin: 4px 0 8px; display: flex; gap: 8px; align-items: center; }
  h2 .n { font-variant-numeric: tabular-nums; }
  .col.nuevos h2 { color: var(--nuevo); }
  .col.listos h2 { color: var(--listo); }
  .lista { display: grid; gap: 10px; }
  .vacio { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }
  .ped { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--nuevo); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
  .ped.listo { border-left-color: var(--listo); }
  .ped.recien { animation: flash 1.2s ease-out 2; }
  @keyframes flash { 0% { background: var(--nuevo-bg); } 100% { background: var(--card); } }
  @media (prefers-reduced-motion: reduce) { .ped.recien { animation: none; background: var(--nuevo-bg); } }
  .arriba { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .codigo { font-size: 2rem; font-weight: 800; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
  .nombre { font-size: 1.15rem; font-weight: 700; }
  .hace { margin-left: auto; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  .detalle { font-size: 1.05rem; }
  .total { color: var(--muted); }
  .acciones { display: flex; gap: 8px; margin-top: 4px; }
  button { font: inherit; cursor: pointer; }
  .btn { flex: 1; border: 0; border-radius: 10px; padding: 14px; font-weight: 800; font-size: 1.05rem; color: var(--btn-ink); }
  .btn.listo { background: var(--listo); }
  .btn.entregar { background: var(--ink); color: var(--bg); }
  .btn.deshacer { flex: 0 0 auto; background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; font-size: .9rem; padding: 10px 12px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--nuevo); outline-offset: 2px; }
  details.entregados { grid-column: 1 / -1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  details.entregados summary { font-weight: 700; cursor: pointer; }
  .fila-ent { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .fila-ent:first-of-type { border-top: 0; }
  #login { max-width: 360px; margin: 12vh auto 0; padding: 0 16px; display: grid; gap: 12px; }
  #login input { font-size: 1.6rem; letter-spacing: .3em; text-align: center; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  #login .btn { background: var(--listo); }
  .error { color: var(--nuevo); font-weight: 600; min-height: 1.4em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<form id="login" autocomplete="off">
  <h1 style="margin:0">Panel del buffet</h1>
  <label for="pin">PIN del buffet</label>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" required>
  <button class="btn" type="submit">Entrar</button>
  <div class="error" id="login-error"></div>
</form>

<div id="app" hidden>
  <header>
    <h1>Pedidos · Buffet SIC</h1>
    <span class="contador" id="c-ent">0 entregados hoy</span>
    <span class="conexion" id="conexion">Conectando…</span>
    <button class="btn deshacer" id="salir" type="button">Salir</button>
  </header>
  <main>
    <section class="col nuevos"><h2>Nuevos <span class="n" id="n-nuevos">0</span></h2><div class="lista" id="l-nuevos"></div></section>
    <section class="col listos"><h2>Listos para retirar <span class="n" id="n-listos">0</span></h2><div class="lista" id="l-listos"></div></section>
    <details class="entregados"><summary>Entregados hoy</summary><div id="l-entregados"></div></details>
  </main>
</div>

<script>
/* ===================== CONFIGURACIÓN ===================== */
const SUPABASE_URL = "https://pqzobcbsqecsnidkdxxu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxem9iY2JzcWVjc25pZGtkeHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NTU2MDQsImV4cCI6MjEwODUzMTYwNH0.3MTeFl49yxBpPz2-a6Olvtnkrl5jkxGfPuFDhxEo8RE";
/* ========================================================= */

const pesos = n => "$" + Number(n).toLocaleString("es-AR");
const hora = t => new Date(t).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
const minutos = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
const CLAVE = "pin_buffet";
let pin = null, timer = null, vistos = null, audio = null;

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify(args),
  });
  if (!r.ok) {
    let msg = "No se pudo conectar";
    try { msg = (await r.json()).message || msg; } catch (e) {}
    throw new Error(msg);
  }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

function sonar() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(audio.currentTime + 0.25);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(200);
}

function tarjeta(p, recien) {
  const el = document.createElement("article");
  el.className = "ped " + p.estado + (recien ? " recien" : "");
  const ahora = new Date();
  el.innerHTML = `
    <div class="arriba"><span class="codigo"></span><span class="nombre"></span><span class="hace"></span></div>
    <div class="detalle"></div>
    <div class="total"></div>
    <div class="acciones"></div>`;
  el.querySelector(".codigo").textContent = p.codigo;
  el.querySelector(".nombre").textContent = p.nombre;
  el.querySelector(".hace").textContent = p.estado === "nuevo"
    ? `pedido ${hora(p.creado_at)} · hace ${minutos(p.creado_at, ahora)} min`
    : `listo ${hora(p.listo_at)} · hace ${minutos(p.listo_at, ahora)} min`;
  el.querySelector(".detalle").textContent = p.detalle;
  el.querySelector(".total").textContent = `${pesos(p.total)} · pagado con Mercado Pago`;
  const acc = el.querySelector(".acciones");
  const boton = (texto, clase, estado) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn " + clase; b.textContent = texto;
    b.onclick = () => cambiar(p.id, estado, b);
    acc.appendChild(b);
  };
  if (p.estado === "nuevo") boton("Listo", "listo", "listo");
  if (p.estado === "listo") { boton("Entregado", "entregar", "entregado"); boton("Deshacer", "deshacer", "nuevo"); }
  return el;
}

function pintar(pedidos) {
  const nuevos = pedidos.filter(p => p.estado === "nuevo");
  const listos = pedidos.filter(p => p.estado === "listo").sort((a, b) => new Date(a.listo_at) - new Date(b.listo_at));
  const entregados = pedidos.filter(p => p.estado === "entregado").reverse();
  const ids = new Set(pedidos.map(p => p.id));
  const nuevosIds = vistos ? nuevos.filter(p => !vistos.has(p.id)).map(p => p.id) : [];
  if (nuevosIds.length) sonar();
  vistos = ids;

  const llenar = (id, lista, vacio) => {
    const cont = document.getElementById(id);
    cont.innerHTML = "";
    if (!lista.length) { const d = document.createElement("div"); d.className = "vacio"; d.textContent = vacio; cont.appendChild(d); return; }
    for (const p of lista) cont.appendChild(tarjeta(p, nuevosIds.includes(p.id)));
  };
  llenar("l-nuevos", nuevos, "No hay pedidos nuevos");
  llenar("l-listos", listos, "Nada esperando retiro");
  document.getElementById("n-nuevos").textContent = nuevos.length;
  document.getElementById("n-listos").textContent = listos.length;
  document.getElementById("c-ent").textContent = `${entregados.length} entregados hoy`;

  const ent = document.getElementById("l-entregados");
  ent.innerHTML = "";
  for (const p of entregados) {
    const f = document.createElement("div");
    f.className = "fila-ent";
    f.textContent = `${p.codigo} · ${p.nombre} · ${p.detalle} · pedido ${hora(p.creado_at)}, listo ${hora(p.listo_at)}, entregado ${hora(p.entregado_at)}`;
    ent.appendChild(f);
  }
}

async function cargar() {
  const estado = document.getElementById("conexion");
  try {
    const pedidos = await rpc("panel_pedidos", { p_pin: pin });
    pintar(pedidos);
    estado.textContent = "Actualizado " + new Date().toLocaleTimeString("es-AR");
    estado.className = "conexion";
  } catch (e) {
    if (/PIN/.test(e.message)) { salir("El PIN cambió o es incorrecto."); return; }
    estado.textContent = "Sin conexión: reintentando…";
    estado.className = "conexion mal";
  }
}

async function cambiar(id, estado, boton) {
  boton.disabled = true;
  try { await rpc("marcar_estado", { p_pin: pin, p_id: id, p_estado: estado }); }
  catch (e) { alertaConexion(); }
  await cargar();
}
function alertaConexion() {
  const estado = document.getElementById("conexion");
  estado.textContent = "No se guardó el cambio: revisá la conexión";
  estado.className = "conexion mal";
}

function entrar(valor) {
  pin = valor;
  try { localStorage.setItem(CLAVE, valor); } catch (e) {}
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
  cargar();
  clearInterval(timer);
  timer = setInterval(cargar, 4000);
}
function salir(msg) {
  clearInterval(timer); pin = null; vistos = null;
  try { localStorage.removeItem(CLAVE); } catch (e) {}
  document.getElementById("app").hidden = true;
  document.getElementById("login").hidden = false;
  document.getElementById("login-error").textContent = msg || "";
}

document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const valor = document.getElementById("pin").value.trim();
  const err = document.getElementById("login-error");
  err.textContent = "Comprobando…";
  try { await rpc("panel_pedidos", { p_pin: valor }); err.textContent = ""; sonar(); entrar(valor); }
  catch (ex) { err.textContent = /PIN/.test(ex.message) ? "PIN incorrecto." : "Sin conexión. Probá de nuevo."; }
});
document.getElementById("salir").onclick = () => salir();
document.addEventListener("visibilitychange", () => { if (!document.hidden && pin) cargar(); });

let guardado = null;
try { guardado = localStorage.getItem(CLAVE); } catch (e) {}
if (guardado) entrar(guardado);
</script>
</body>
</html>
